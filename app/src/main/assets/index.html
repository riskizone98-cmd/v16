<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Match Counter MLBB</title>
<style>
:root{--bg-dark:#0b1120;--card-bg:#1e293b;--card-border:#334155;--accent-gold:#fbbf24;--btn-green:#22c55e;--text-main:#f8fafc;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg-dark);color:var(--text-main);padding:8px;min-height:100vh}
.container{width:100%;max-width:1100px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.header-brand{display:flex;align-items:center;gap:8px;min-width:0}.app-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1.5px solid #475569;flex-shrink:0}
.header-title h1{font-size:14px;font-weight:800;letter-spacing:.4px}.header-title h1 span{color:var(--accent-gold)}.header-title p{font-size:10px;color:var(--text-muted);margin-top:2px}
.global-total{font-size:10px;color:var(--text-muted);text-align:right;white-space:nowrap}.global-total b{color:#fff;font-size:14px}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
.room{background:#111c30;border:1px solid #334155;border-radius:10px;padding:7px;min-width:0}
.room-head{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:7px}.room-title{font-size:13px;font-weight:900;color:var(--accent-gold);letter-spacing:.3px}
.btn-add{background:#fde047;color:#1e293b;border:0;padding:6px 7px;border-radius:6px;font-size:10px;font-weight:900;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}.stat{background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;padding:5px;min-width:0}.stat span{display:block;color:var(--text-muted);font-size:9px}.stat b{font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}.actions button{border:0;border-radius:6px;padding:7px 3px;font-size:9px;font-weight:900;min-width:0}.minus-all{background:#22c55e;color:#0b1120}.undo-all{background:#263449;color:#cbd5e1;border:1px solid #475569!important}
.room-orders-title{font-size:9px;color:var(--text-muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:flex;justify-content:space-between}
.order-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:7px;padding:6px;margin-bottom:5px;min-width:0}.order-card.is-frozen{border-color:#92400e;background:#1c1a17}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px}.client-info{display:flex;align-items:center;gap:4px;min-width:0}.client-name{font-size:11px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{font-size:7px;font-weight:900;padding:2px 4px;border-radius:10px;white-space:nowrap;flex-shrink:0}.aktif{background:#1d4ed8;color:#bfdbfe}.beku{background:#92400e;color:#fde68a}.selesai{background:#15803d;color:#bbf7d0}.count{font-size:12px;font-weight:900;white-space:nowrap}.count small{font-size:9px;color:var(--text-muted)}
.progress{height:3px;background:#0f172a;border-radius:3px;overflow:hidden;margin-bottom:5px}.fill{height:100%;background:#22c55e}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:4px}.controls button{padding:5px 2px;border-radius:5px;font-size:9px;font-weight:800;min-width:0;border:1px solid transparent;white-space:nowrap}.btn-minus{background:#22c55e;color:#0b1120}.btn-undo{background:#0f172a;color:#cbd5e1;border-color:#334155!important}.btn-addmatch{background:#1d4ed8;color:#dbeafe;border-color:#1e40af!important}.btn-freeze{background:#422006;color:#fcd34d;border-color:#92400e!important;font-size:14px!important}.btn-delete{background:#0f172a;color:#f87171;border-color:#334155!important}
.empty{padding:18px 5px;text-align:center;color:var(--text-muted);font-size:10px;line-height:1.4}.footer{text-align:center;margin:10px 0 3px;color:#64748b;font-size:10px;font-weight:700;letter-spacing:.3px}
.modal{display:none;position:fixed;inset:0;background:#000b;justify-content:center;align-items:center;z-index:10;padding:16px}.modal-content{background:var(--card-bg);border:1px solid var(--card-border);padding:16px;border-radius:12px;width:100%;max-width:360px}.modal-content h3{font-size:15px;margin-bottom:12px}.modal-content label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px}.modal-content input,.modal-content select{width:100%;background:#0b1120;border:1px solid var(--card-border);padding:9px;border-radius:7px;color:#fff;font-size:13px;margin-bottom:10px}.modal-buttons{display:flex;justify-content:flex-end;gap:7px}.modal-buttons button{border:0;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:800}.cancel{background:#334155;color:#fff}.submit{background:#22c55e;color:#0b1120}
@media(min-width:700px){.rooms{gap:12px}.room{padding:10px}.room-title{font-size:16px}.client-name{font-size:13px}.controls button{font-size:11px;padding:7px}.stat span{font-size:10px}.stat b{font-size:17px}}
@media(max-width:350px){body{padding:4px}.rooms{gap:4px}.room{padding:5px}.room-title{font-size:11px}.btn-add{font-size:9px;padding:5px 4px}.client-name{font-size:10px}.controls button{font-size:8px}.actions button{font-size:8px}}

.room-toolbar{display:flex;gap:7px;align-items:center;margin:8px 0;flex-wrap:wrap}
.room-toolbar input{flex:1;min-width:130px;background:#0b1120;border:1px solid #334155;border-radius:7px;padding:9px;color:#fff;font-size:12px}
.room-toolbar button,.room-manage{background:#fde047;color:#1e293b;border:0;border-radius:7px;padding:8px 10px;font-size:10px;font-weight:900}
.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}
.room-head{flex-wrap:wrap}.room-title{flex:1}
.status-select{max-width:115px;background:#0b1120;color:#cbd5e1;border:1px solid #334155;border-radius:5px;padding:4px;font-size:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#15803d;color:#fff;padding:11px 15px;border-radius:9px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0008;z-index:30;display:none;max-width:90%;text-align:center}
.room-delete{background:#7f1d1d;color:#fecaca;border:1px solid #991b1b;border-radius:5px;padding:4px 6px;font-size:9px;font-weight:800}
</style></head><body><div class="container">

<div class="room-toolbar">
  <input id="searchCustomer" type="search" placeholder="Cari nama pelanggan..." oninput="setSearch(this.value)">
  <button onclick="addRoom()">＋ TAMBAH ROOM</button>
</div>
<main class="rooms" id="roomsContainer"></main>
<footer class="footer">Kyy Vjestt</footer></div>

<div class="modal" id="addModal"><div class="modal-content">
<h3>Tambah Pelanggan</h3>
<label>Room tujuan</label><div id="selectedRoomLabel" style="margin-bottom:10px;color:#fde047;font-size:12px;font-weight:800"></div>
<label>Nama pelanggan</label><input type="text" id="inputName" placeholder="Nama pelanggan">
<label>Jumlah match</label><input type="number" id="inputMatch" placeholder="Contoh: 8" min="1">
<div class="modal-buttons"><button class="cancel" onclick="closeModal()">Batal</button><button class="submit" onclick="addOrder()">Simpan</button></div>
</div></div><div class="toast" id="toast"></div>
</div>

<script>
const STORAGE_KEY='mlbb_counter_orders_v5';
const ROOM_KEY='mlbb_counter_rooms_v1';
function loadOrders(){
  try{
    let raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) raw=localStorage.getItem('mlbb_counter_orders_v4');
    if(!raw) raw=localStorage.getItem('mlbb_counter_orders_v3');
    const parsed=JSON.parse(raw||'null');
    if(Array.isArray(parsed)) return parsed;
  }catch(e){console.warn('Data lama tidak dapat dibaca',e);}
  return [{id:1,name:'kyy vjestt',total:8,remaining:8,history:[],room:1,frozen:false,status:'Sedang Dikerjakan'}];
}
let orders=loadOrders().map(o=>({...o,room:Number(o.room)||1,frozen:Boolean(o.frozen),history:Array.isArray(o.history)?o.history:[],status:o.status||(Number(o.remaining)===0?'Selesai':'Sedang Dikerjakan')}));
function loadRooms(){
  try{const saved=JSON.parse(localStorage.getItem(ROOM_KEY)||'null');if(Array.isArray(saved)&&saved.length)return saved;}
  catch(e){}
  const ids=[...new Set(orders.map(o=>o.room))].sort((a,b)=>a-b);
  return (ids.length?ids:[1]).map(id=>({id,name:'Room '+id}));
}
let rooms=loadRooms(), selectedRoom=rooms[0].id, searchText='';
let nextRoomId=Math.max(0,...rooms.map(r=>Number(r.id)||0))+1;
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(orders));localStorage.setItem(ROOM_KEY,JSON.stringify(rooms));}
function saveData(){persist();render();}
function toast(message){
  const el=document.getElementById('toast');el.textContent=message;el.style.display='block';
  clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.style.display='none',3000);
}
function addRoom(){
  const name=prompt('Nama room baru:','Room '+nextRoomId);
  if(name===null)return;
  const clean=name.trim();if(!clean){alert('Nama room tidak boleh kosong.');return;}
  const id=nextRoomId++;rooms.push({id,name:clean});selectedRoom=id;saveData();toast(clean+' berhasil ditambahkan.');
}
function deleteRoom(id){
  if(rooms.length<=1){alert('Minimal harus ada satu room.');return;}
  const room=rooms.find(r=>r.id===id);const count=orders.filter(o=>o.room===id).length;
  if(!confirm('Hapus '+room.name+'? '+(count?'Pelanggan di dalamnya akan dipindahkan ke room pertama.':'Room ini kosong.')))return;
  const target=rooms.find(r=>r.id!==id);
  orders.forEach(o=>{if(o.room===id)o.room=target.id;});
  rooms=rooms.filter(r=>r.id!==id);if(selectedRoom===id)selectedRoom=target.id;saveData();
}
function setSearch(value){searchText=String(value||'').trim().toLowerCase();render();}
function openModal(room){selectedRoom=room;document.getElementById('selectedRoomLabel').textContent=rooms.find(r=>r.id===room)?.name||'Room';document.getElementById('addModal').style.display='flex';document.getElementById('inputName').focus();}
function closeModal(){document.getElementById('addModal').style.display='none';document.getElementById('inputName').value='';document.getElementById('inputMatch').value='';}
function addOrder(){
  const name=document.getElementById('inputName').value.trim(),match=parseInt(document.getElementById('inputMatch').value,10);
  if(!name||!Number.isInteger(match)||match<=0){alert('Masukkan nama dan jumlah match yang valid!');return;}
  orders.unshift({id:Date.now()+Math.floor(Math.random()*1000),name,total:match,remaining:match,history:[],room:selectedRoom,frozen:false,status:'Sedang Dikerjakan'});
  closeModal();saveData();toast('Pelanggan '+name+' berhasil ditambahkan.');
}
function markFinished(o){
  if(o.remaining===0&&o.status!=='Selesai'){o.status='Selesai';toast('MATCH SELESAI: '+o.name);}
  else if(o.remaining>0&&o.status==='Selesai')o.status='Sedang Dikerjakan';
}
function minusMatch(id){const o=orders.find(x=>x.id===id);if(o&&!o.frozen&&o.status==='Sedang Dikerjakan'&&o.remaining>0){o.history.push(o.remaining);o.remaining--;markFinished(o);saveData();}}
function undoMatch(id){const o=orders.find(x=>x.id===id);if(o&&!o.frozen&&o.status==='Sedang Dikerjakan'&&o.history.length){o.remaining=o.history.pop();if(o.remaining>0&&o.status==='Selesai')o.status='Sedang Dikerjakan';saveData();}}
function addMatch(id){const o=orders.find(x=>x.id===id);if(!o)return;const raw=prompt('Tambah berapa match untuk '+o.name+'?','10');if(raw===null)return;const amount=Number(raw.trim());if(!Number.isSafeInteger(amount)||amount<=0){alert('Masukkan jumlah match berupa angka bulat lebih dari 0.');return;}o.total+=amount;o.remaining+=amount;o.history=o.history.map(value=>value+amount);if(o.status==='Selesai')o.status='Sedang Dikerjakan';saveData();}
function toggleFreeze(id){const o=orders.find(x=>x.id===id);if(o){o.frozen=!o.frozen;saveData();}}
function changeStatus(id,value){const o=orders.find(x=>x.id===id);if(!o)return;o.status=value;if(value==='Selesai'&&o.remaining>0){if(confirm('Tandai selesai dan set sisa match menjadi 0?')){o.history.push(o.remaining);o.remaining=0;}else{o.status='Sedang Dikerjakan';}}saveData();if(value==='Selesai')toast('Status '+o.name+': Selesai');}
function deleteOrder(id){if(confirm('Hapus orderan ini?')){orders=orders.filter(x=>x.id!==id);saveData();}}
function minusAllMatch(room){let changed=false;orders.forEach(o=>{if(o.room===room&&!o.frozen&&o.status==='Sedang Dikerjakan'&&o.remaining>0){o.history.push(o.remaining);o.remaining--;markFinished(o);changed=true;}});if(changed)saveData();}
function undoAllMatch(room){let changed=false;orders.forEach(o=>{if(o.room===room&&!o.frozen&&o.status==='Sedang Dikerjakan'&&o.history.length){o.remaining=o.history.pop();if(o.remaining>0&&o.status==='Selesai')o.status='Sedang Dikerjakan';changed=true;}});if(changed)saveData();}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderRoom(room){
  const roomOrders=orders.filter(o=>o.room===room.id),filtered=roomOrders.filter(o=>o.name.toLowerCase().includes(searchText));
  let active=0,total=0;roomOrders.forEach(o=>{if(o.remaining>0&&!o.frozen&&o.status==='Sedang Dikerjakan')active++;total+=o.remaining;});
  const cards=filtered.map(o=>{
    const finished=o.remaining===0,percent=o.total>0?Math.max(0,Math.min(100,o.remaining/o.total*100)):0;
    const frozen=o.frozen?'<span class="status beku">DIBEKUKAN</span>':'';
    const statusClass=o.status==='Selesai'?'selesai':o.status==='Sedang Dikerjakan'?'aktif':'';
    const status=frozen||`<span class="status ${statusClass}">${escapeHtml(o.status)}</span>`;
    return `<article class="order-card${o.frozen?' is-frozen':''}">
      <div class="order-top"><div class="client-info"><span class="client-name" title="${escapeHtml(o.name)}">${escapeHtml(o.name)}</span>${status}</div><div class="count">${o.remaining}<small>/${o.total}</small></div></div>
      <div style="display:flex;justify-content:flex-end;margin:-1px 0 4px"><select class="status-select" aria-label="Status pelanggan" onchange="changeStatus(${Number(o.id)},this.value)">
      ${['Menunggu','Sedang Dikerjakan','Selesai'].map(v=>`<option ${o.status===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="progress"><div class="fill" style="width:${percent}%;${finished?'background:#15803d;':''}"></div></div>
      <div class="controls"><button class="btn-minus" onclick="minusMatch(${Number(o.id)})" ${finished||o.frozen||o.status!=='Sedang Dikerjakan'?'disabled style="opacity:.45"':''}>− 1 MATCH</button><button class="btn-undo" onclick="undoMatch(${Number(o.id)})" ${o.frozen||o.status!=='Sedang Dikerjakan'||!o.history.length?'disabled style="opacity:.45"':''}>↶ Undo</button><button class="btn-addmatch" onclick="addMatch(${Number(o.id)})">+ MATCH</button><button class="btn-freeze" title="${o.frozen?'Aktifkan pelanggan':'Bekukan pelanggan'}" aria-label="${o.frozen?'Aktifkan pelanggan':'Bekukan pelanggan'}" onclick="toggleFreeze(${Number(o.id)})">Ⅱ</button><button class="btn-delete" onclick="deleteOrder(${Number(o.id)})">Hapus</button></div>
    </article>`;
  }).join('');
  return `<section class="room"><div class="room-head"><div class="room-title">⚔ ${escapeHtml(room.name.toUpperCase())}</div><button class="btn-add" onclick="openModal(${Number(room.id)})">+ PELANGGAN</button><button class="room-delete" onclick="deleteRoom(${Number(room.id)})">Hapus Room</button></div>
  <div class="stats"><div class="stat"><span>Pelanggan aktif</span><b>${active}</b></div><div class="stat"><span>Match tersisa</span><b>${total}</b></div></div>
  <div class="actions"><button class="minus-all" onclick="minusAllMatch(${Number(room.id)})">− 1 MATCH SEMUA</button><button class="undo-all" onclick="undoAllMatch(${Number(room.id)})">↶ UNDO SEMUA</button></div>
  <div class="room-orders-title"><span>Daftar pelanggan</span><span>${roomOrders.length} order</span></div>
  ${cards||`<div class="empty">${searchText?'Pelanggan tidak ditemukan.':'Belum ada pelanggan.<br>Tekan + PELANGGAN untuk menambahkan.'}</div>`}</section>`;
}
function render(){
  document.getElementById('roomsContainer').innerHTML=rooms.map(renderRoom).join('');

<script>
(function () {
  document.addEventListener('click', function (event) {
    const action = event.target && event.target.closest
      ? event.target.closest('button, a, input[type="button"], input[type="submit"], [role="button"]')
      : null;
    if (!action || action.disabled || action.getAttribute('aria-disabled') === 'true') return;
    if (window.ActionSound && typeof window.ActionSound.play === 'function') {
      window.ActionSound.play();
    }
  }, true);
})();
</script>
